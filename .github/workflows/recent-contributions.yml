name: Refresh open source contributions

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - .github/scripts/render_contributions.py
      - .github/workflows/recent-contributions.yml

permissions:
  contents: write

concurrency:
  group: recent-contributions

jobs:
  refresh:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - name: Refresh the chart if contributions changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chart=assets/weekly-contributions.svg
          rendered=$(mktemp)
          python3 .github/scripts/render_contributions.py > "$rendered"
          if cmp -s "$chart" "$rendered"; then
            echo "The contribution chart is already up to date."
            exit 0
          fi
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$chart" \
            -f message='Refresh weekly contribution chart' \
            -f sha="$(git rev-parse "HEAD:$chart")" \
            -f content="$(base64 -w 0 "$rendered")" --silent
